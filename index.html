<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dossiê Confidencial — Segurança da Informação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0b1420;
    --navy-2:#101d2e;
    --paper:#eee4cd;
    --paper-2:#e4d8bb;
    --ink:#2a2118;
    --ink-faint:#6b6152;
    --amber:#e0a03c;
    --amber-dark:#a56f1f;
    --teal:#3fb6a8;
    --red:#a83a32;
    --line: rgba(42,33,24,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 20% -10%, #16273c 0%, transparent 55%),
      radial-gradient(ellipse at 100% 110%, #16233a 0%, transparent 50%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px),
      var(--navy);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:32px 16px 80px;
  }
  .wrap{max-width:860px;margin:0 auto;}

  /* ===== Header / case stamp ===== */
  .case-header{
    display:flex; justify-content:space-between; align-items:flex-end; gap:16px;
    border-bottom:1px dashed rgba(238,228,205,0.25);
    padding-bottom:18px; margin-bottom:28px; flex-wrap:wrap;
  }
  .case-id{
    font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:0.08em;
    color:var(--amber); text-transform:uppercase; opacity:0.9;
  }
  .case-title{
    font-family:'Special Elite',monospace; font-size:clamp(28px,5vw,42px);
    margin:6px 0 4px; line-height:1.05; color:var(--paper);
  }
  .case-sub{ color:#9fb0c2; font-size:14px; max-width:520px;}
  .stamp{
    font-family:'Special Elite',monospace; border:3px solid var(--red); color:var(--red);
    padding:6px 14px; border-radius:4px; transform:rotate(-6deg); font-size:13px;
    letter-spacing:0.12em; white-space:nowrap; opacity:0.85; text-transform:uppercase;
  }

  /* ===== progress tabs ===== */
  .tabs{ display:flex; gap:6px; margin-bottom:0; overflow-x:auto; padding-bottom:2px;}
  .tab{
    flex:1; min-width:140px; font-family:'JetBrains Mono',monospace; font-size:12px;
    text-align:center; padding:12px 8px 10px; color:#7d8ea0; background:var(--navy-2);
    border:1px solid rgba(238,228,205,0.12); border-bottom:none;
    clip-path: polygon(8px 0, 100% 0, 100% 100%, 0 100%, 0 8px);
    cursor:default; position:relative; transition:color .25s, background .25s;
  }
  .tab .n{display:block; font-size:16px; font-weight:700; margin-bottom:2px;}
  .tab.active{ color:var(--paper); background:#152538; }
  .tab.done{ color:var(--teal); }
  .tab.done::after{content:"✓ decifrado"; display:block; font-size:10px; margin-top:3px; letter-spacing:.05em;}
  .tab.locked{ color:#455a70; }
  .tab.locked::after{content:"🔒 bloqueado"; display:block; font-size:10px; margin-top:3px; letter-spacing:.05em;}

  /* ===== dossier card ===== */
  .card{
    background: var(--paper);
    color: var(--ink);
    border-radius:2px;
    box-shadow: 0 24px 50px -20px rgba(0,0,0,0.6), 0 2px 0 rgba(255,255,255,0.04) inset;
    padding:32px 30px 30px;
    position:relative;
    background-image:
      linear-gradient(var(--paper), var(--paper)),
      repeating-linear-gradient(180deg, rgba(0,0,0,0.025) 0px, rgba(0,0,0,0.025) 1px, transparent 1px, transparent 26px);
    background-blend-mode:normal;
  }
  .card::before{
    content:""; position:absolute; inset:10px; border:1px solid rgba(42,33,24,0.15); pointer-events:none;
  }
  .stage-eyebrow{
    font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--amber-dark); margin-bottom:6px;
  }
  .stage-title{ font-family:'Special Elite',monospace; font-size:26px; margin:0 0 14px; color:var(--ink); }
  .stage-text{ font-size:15px; line-height:1.65; color:var(--ink); margin:0 0 16px;}
  .stage-text b{color:var(--ink);}
  .hint{
    font-size:13.5px; color:var(--ink-faint); border-left:3px solid var(--amber); padding:8px 12px;
    background:rgba(224,160,60,0.12); margin:14px 0; line-height:1.5;
  }

  .mono-box{
    font-family:'JetBrains Mono',monospace; background:#1c150e; color:#f1e6c8;
    padding:16px 18px; border-radius:4px; font-size:15px; letter-spacing:0.04em;
    word-break:break-word; line-height:1.7; margin:14px 0; border:1px solid rgba(0,0,0,0.3);
  }
  .cipher-line{font-size:19px; font-weight:700; letter-spacing:0.12em; color:var(--amber);}

  table.keytable{ border-collapse:collapse; font-family:'JetBrains Mono',monospace; font-size:12.5px; margin:14px 0; width:100%; overflow-x:auto; display:block;}
  table.keytable td{ border:1px solid var(--line); padding:5px 6px; text-align:center; min-width:20px;}
  table.keytable tr:first-child td{ font-weight:700; background:rgba(42,33,24,0.06);}

  .field-row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:14px;}
  input[type=text]{
    font-family:'JetBrains Mono',monospace; font-size:15px; padding:11px 12px; border-radius:4px;
    border:1.5px solid rgba(42,33,24,0.35); background:#fbf7ec; color:var(--ink); flex:1; min-width:200px;
  }
  input[type=text]:focus{ outline:none; border-color:var(--amber-dark); }
  button{
    font-family:'Inter',sans-serif; font-weight:600; font-size:14px; padding:11px 20px; border-radius:4px;
    border:none; background:var(--ink); color:var(--paper); cursor:pointer; transition:transform .15s, background .2s;
  }
  button:hover{ background:#3d3020; transform:translateY(-1px);}
  button.secondary{ background:transparent; color:var(--ink); border:1.5px solid var(--ink); }
  button.secondary:hover{background:rgba(0,0,0,0.06);}

  .feedback{ margin-top:12px; font-size:14px; font-weight:600; font-family:'JetBrains Mono',monospace; min-height:20px;}
  .feedback.ok{ color:#1f7a5c; }
  .feedback.err{ color:var(--red); }

  .order-item{
    display:flex; align-items:center; gap:12px; background:rgba(42,33,24,0.05);
    border:1px solid var(--line); border-radius:4px; padding:10px 12px; margin-bottom:8px; font-size:14px;
  }
  .order-item select{
    font-family:'JetBrains Mono',monospace; font-weight:700; padding:6px 8px; border-radius:3px;
    border:1.5px solid rgba(42,33,24,0.35); background:#fbf7ec; color:var(--ink);
  }

  .solved-stamp{
    position:absolute; top:20px; right:26px; transform:rotate(8deg);
    font-family:'Special Elite',monospace; color:var(--teal); border:3px solid var(--teal);
    padding:6px 12px; border-radius:4px; font-size:14px; letter-spacing:.1em; text-transform:uppercase;
    opacity:0; transition:opacity .4s;
  }
  .solved-stamp.show{ opacity:0.85; }

  .nav-row{ display:flex; justify-content:space-between; margin-top:22px; }

  .rsa-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin:14px 0;}
  .rsa-box{ background:#1c150e; color:#f1e6c8; border-radius:4px; padding:10px 12px; font-family:'JetBrains Mono',monospace; text-align:center;}
  .rsa-box .lbl{ font-size:11px; color:#b3a37c; text-transform:uppercase; letter-spacing:.08em;}
  .rsa-box .val{ font-size:20px; font-weight:700; color:var(--amber);}

  .final-screen{ text-align:center; padding:20px 0 6px;}
  .final-screen .big{ font-family:'Special Elite',monospace; font-size:32px; color:var(--teal);}
  .progress-bar-outer{ height:6px; background:rgba(238,228,205,0.12); border-radius:6px; margin:18px 0 26px; overflow:hidden;}
  .progress-bar-inner{ height:100%; background:linear-gradient(90deg,var(--amber),var(--teal)); width:0%; transition:width .5s;}

  footer{ text-align:center; color:#5c6d80; font-size:12px; margin-top:40px; font-family:'JetBrains Mono',monospace;}
  @media(max-width:560px){ .case-header{flex-direction:column; align-items:flex-start;} }
</style>
</head>
<body>
<div class="wrap">

  <div class="case-header">
    <div>
      <div class="case-id" id="caseId">PROCESSO Nº SI-2026 · 8º PERÍODO</div>
      <div class="case-title">Dossiê da Criptografia</div>
      <div class="case-sub">Seis mensagens interceptadas. Seis técnicas de proteção da informação. Decifre todas para encerrar o caso.</div>
    </div>
    <div class="stamp">Confidencial</div>
  </div>

  <div class="progress-bar-outer"><div class="progress-bar-inner" id="progBar"></div></div>

  <div class="tabs" id="tabs"></div>

  <div class="card" id="card">
    <div class="solved-stamp" id="solvedStamp">Decifrado</div>
    <div id="stageContent"></div>
  </div>

  <footer>Segurança da Informação · Criptografia Simétrica, Assimétrica, KDC e Estratégia Híbrida</footer>
</div>

<script>
/* ---------------- utils ---------------- */
function modpow(base, exp, mod){
  let result = 1; base = base % mod;
  while(exp > 0){
    if(exp % 2 === 1) result = (result*base) % mod;
    exp = Math.floor(exp/2);
    base = (base*base) % mod;
  }
  return result;
}
function normalize(s){
  return s.toUpperCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^A-Z0-9]/g,' ')
    .trim().replace(/\s+/g,' ');
}
function xorBytes(text, key){
  let out = [];
  for(let i=0;i<text.length;i++){
    out.push(text.charCodeAt(i) ^ key.charCodeAt(i % key.length));
  }
  return out;
}
function bytesToB64(bytes){
  let bin = bytes.map(b=>String.fromCharCode(b)).join('');
  return btoa(bin);
}
function b64ToXorDecrypt(b64, key){
  try{
    let bin = atob(b64);
    let out = '';
    for(let i=0;i<bin.length;i++){
      out += String.fromCharCode(bin.charCodeAt(i) ^ key.charCodeAt(i % key.length));
    }
    return out;
  }catch(e){ return ''; }
}

/* ---------------- state ---------------- */
const state = { solved:{1:false,2:false,3:false,4:false,5:false,6:false}, current:1 };

/* ---------------- Stage 1 data: substitution cipher ---------------- */
const subMap = {A:'Y',B:'M',C:'R',D:'J',E:'U',F:'P',G:'T',H:'O',I:'V',J:'D',K:'X',L:'Z',M:'B',N:'S',O:'H',P:'F',Q:'W',R:'C',S:'N',T:'G',U:'E',V:'Q',W:'I',X:'K',Y:'A',Z:'L'};
const stage1Cipher = "FCHGUDY NEY ROYQU";
const stage1Answer = "PROTEJA SUA CHAVE";

/* ---------------- Stage 2 data: XOR symmetric ---------------- */
const stage2Key = "SI2026";
const stage2Plain = "CHAVES FRACAS SAO PERIGOSAS";
const stage2Cipher = bytesToB64(xorBytes(stage2Plain, stage2Key));

/* ---------------- Stage 3 data: mini-RSA ---------------- */
const rsaN = 55, rsaE = 7, rsaD = 23; // p=5 q=11 phi=40
const rsaWord = "CHAVE";
const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const rsaCiphers = rsaWord.split('').map(ch=>{
  const m = alphabet.indexOf(ch) + 1;
  return modpow(m, rsaE, rsaN);
});

/* ---------------- Stage 4 data: hybrid protocol ordering ---------------- */
const stage4Steps = [
  {id:'a', text:'João gera uma chave secreta de sessão, que será usada para cifrar as mensagens.', order:1},
  {id:'b', text:'João cifra essa chave de sessão com a chave pública de Ana e envia a mensagem para ela.', order:2},
  {id:'c', text:'Ana recebe a mensagem e a decifra com sua chave privada, obtendo a chave de sessão.', order:3},
  {id:'d', text:'João e Ana passam a se comunicar usando a chave de sessão compartilhada, com criptografia simétrica.', order:4},
];
let stage4Shuffled = [...stage4Steps].sort(()=>Math.random()-0.5);

/* ---------------- Stage 5 data: KDC ---------------- */
const stage5Options = [
  {id:'a', text:'Porque o KDC envia as chaves de sessão em texto aberto, mas por uma rede privada.'},
  {id:'b', text:'Porque cada usuário compartilha, desde o cadastro, uma chave secreta própria e diferente com o KDC — só quem tem essa chave consegue ler o que o KDC envia.'},
  {id:'c', text:'Porque o KDC apaga a chave de sessão logo depois de criá-la, antes de qualquer envio.'},
  {id:'d', text:'Porque a chave de sessão é sempre a mesma para todos os usuários do sistema.'},
];
const stage5Correct = 'b';

/* ---------------- Stage 6 data: função hash / integridade ---------------- */
const stage6Original  = "LOG DE ACESSO: usuario=joao.silva horario=14/08/2026-08:42 origem=192.168.10.23 status=AUTORIZADO";
const stage6Tampered   = "LOG DE ACESSO: usuario=joao.silva horario=14/08/2026-08:42 origem=192.168.10.28 status=AUTORIZADO";
async function sha256Hex(str){
  const data = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
let stage6PublishedHash = '';

/* ---------------- render tabs ---------------- */
const tabNames = {1:'Cifra de Substituição',2:'Criptografia Simétrica',3:'Criptografia Assimétrica',4:'Estratégia Híbrida',5:'Centro de Distribuição de Chaves',6:'Função Hash / Integridade'};
function renderTabs(){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  for(let i=1;i<=6;i++){
    const locked = i>1 && !state.solved[i-1] && !state.solved[i];
    const div = document.createElement('div');
    div.className = 'tab' + (i===state.current?' active':'') + (state.solved[i]?' done':(locked?' locked':''));
    div.innerHTML = `<span class="n">0${i}</span>${tabNames[i]}`;
    if(!locked){
      div.style.cursor = 'pointer';
      div.onclick = ()=>{ state.current=i; render(); };
    }
    tabs.appendChild(div);
  }
  const solvedCount = Object.values(state.solved).filter(Boolean).length;
  document.getElementById('progBar').style.width = (solvedCount/6*100)+'%';
}

/* ---------------- render stage content ---------------- */
function render(){
  renderTabs();
  const stamp = document.getElementById('solvedStamp');
  stamp.classList.toggle('show', state.solved[state.current]);
  const el = document.getElementById('stageContent');

  if(state.current===1) el.innerHTML = stage1HTML();
  if(state.current===2) el.innerHTML = stage2HTML();
  if(state.current===3) el.innerHTML = stage3HTML();
  if(state.current===4) el.innerHTML = stage4HTML();
  if(state.current===5) el.innerHTML = stage5HTML();
  if(state.current===6) el.innerHTML = stage6HTML();

  attachHandlers();
}

function stage1HTML(){
  let rows1='<tr>', rows2='<tr>';
  Object.keys(subMap).forEach(k=>{ rows1+=`<td>${k}</td>`; rows2+=`<td>${subMap[k]}</td>`; });
  rows1+='</tr>'; rows2+='</tr>';
  return `
    <div class="stage-eyebrow">Estágio 01 · Cifra de substituição monoalfabética</div>
    <h2 class="stage-title">A primeira mensagem interceptada</h2>
    <p class="stage-text">Um agente interceptou o texto abaixo. Ele foi cifrado trocando cada letra do alfabeto por outra, seguindo a tabela de chaves capturada junto com a mensagem. Use a tabela para decifrar o texto.</p>
    <table class="keytable"><tbody>${rows1}${rows2}</tbody></table>
    <div class="mono-box">Texto cifrado:<br><span class="cipher-line">${stage1Cipher}</span></div>
    <div class="field-row">
      <input type="text" id="s1input" placeholder="Digite o texto decifrado...">
      <button onclick="checkStage1()">Verificar</button>
    </div>
    <div class="feedback" id="s1feedback"></div>
  `;
}

function stage2HTML(){
  return `
    <div class="stage-eyebrow">Estágio 02 · Criptografia simétrica</div>
    <h2 class="stage-title">Um segredo compartilhado — mas fraco</h2>
    <p class="stage-text">Esta mensagem foi cifrada com um algoritmo simétrico simples (XOR), usando uma <b>chave secreta</b> conhecida apenas pelo emissor e pelo receptor. O problema clássico da criptografia simétrica é justamente esse: se a chave for fraca ou previsível, qualquer pessoa que a descubra pode decifrar a mensagem.</p>
    <div class="mono-box">Texto cifrado (Base64):<br><span class="cipher-line" style="font-size:15px">${stage2Cipher}</span></div>
    <div class="hint">Dica: o responsável por essa comunicação sempre usa a mesma convenção de chave — a sigla da disciplina seguida do ano atual da turma.</div>
    <p class="stage-text" style="margin-bottom:6px;">Descubra a chave e veja a mensagem ser revelada em tempo real:</p>
    <div class="field-row">
      <input type="text" id="s2input" placeholder="Digite a chave...">
      <button onclick="checkStage2()">Decifrar</button>
    </div>
    <div class="mono-box" id="s2preview" style="min-height:22px; color:#7d8ea0;">Aguardando chave...</div>
    <div class="feedback" id="s2feedback"></div>
  `;
}

function stage3HTML(){
  let boxes = rsaCiphers.map((c,i)=>`<div class="rsa-box"><div class="lbl">Letra ${i+1}</div><div class="val">${c}</div></div>`).join('');
  return `
    <div class="stage-eyebrow">Estágio 03 · Criptografia assimétrica (RSA simplificado)</div>
    <h2 class="stage-title">Chave pública, chave privada</h2>
    <p class="stage-text">Uma palavra de cinco letras foi cifrada, letra por letra, com um mini-RSA: cada letra (A=1 ... Z=26) virou um número <b>m</b>, transformado em <b>c = m<sup>e</sup> mod n</b>. A chave pública abaixo foi capturada — mas só quem tiver a chave privada <b>d</b> consegue decifrar.</p>
    <div class="rsa-grid">
      <div class="rsa-box"><div class="lbl">n (público)</div><div class="val">${rsaN}</div></div>
      <div class="rsa-box"><div class="lbl">e (público)</div><div class="val">${rsaE}</div></div>
    </div>
    <div class="hint">Dica: fatore n em dois primos p e q, calcule φ(n) = (p−1)(q−1), e encontre d tal que (e × d) mod φ(n) = 1.</div>
    <p class="stage-text" style="margin-bottom:6px;">Números cifrados (um por letra):</p>
    <div class="rsa-grid">${boxes}</div>
    <div class="field-row">
      <input type="text" id="s3input" placeholder="Digite o valor de d...">
      <button onclick="checkStage3()">Testar chave privada</button>
    </div>
    <div class="mono-box" id="s3preview" style="min-height:22px; color:#7d8ea0;">Mensagem ainda bloqueada.</div>
    <div class="feedback" id="s3feedback"></div>
  `;
}

function stage4HTML(){
  let items = stage4Shuffled.map(s=>`
    <div class="order-item">
      <select data-id="${s.id}">
        <option value="0">—</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
      </select>
      <span>${s.text}</span>
    </div>
  `).join('');
  return `
    <div class="stage-eyebrow">Estágio 04 · Estratégia híbrida</div>
    <h2 class="stage-title">Reconstrua o protocolo</h2>
    <p class="stage-text">A estratégia híbrida une a segurança da criptografia assimétrica com a velocidade da simétrica. Os quatro passos abaixo foram embaralhados. Numere-os na ordem correta (1 a 4).</p>
    <div id="s4items">${items}</div>
    <button onclick="checkStage4()">Verificar ordem</button>
    <div class="feedback" id="s4feedback"></div>
  `;
}

function stage5HTML(){
  let opts = stage5Options.map(o=>`
    <div class="order-item" style="cursor:pointer;" data-choice="${o.id}" onclick="selectStage5('${o.id}')">
      <span style="font-family:'JetBrains Mono',monospace; font-weight:700;">${o.id.toUpperCase()}</span>
      <span>${o.text}</span>
    </div>
  `).join('');
  return `
    <div class="stage-eyebrow">Estágio 05 · Centro de Distribuição de Chaves (KDC)</div>
    <h2 class="stage-title">O intermediário de confiança</h2>
    <p class="stage-text">João pede ao KDC para se comunicar com Maria. O KDC gera uma chave de sessão e a envia para os dois, cada um recebendo sua cópia por um canal próprio. Um interceptador consegue capturar essas mensagens no meio do caminho — mas não consegue lê-las.</p>
    <div class="hint">Pense em como o KDC identifica cada usuário e protege o que envia a ele.</div>
    <p class="stage-text" style="margin-bottom:6px;"><b>Pergunta:</b> por que os dados enviados pelo KDC a João e a Maria permanecem protegidos mesmo se um atacante os interceptar?</p>
    <div id="s5items">${opts}</div>
    <div class="feedback" id="s5feedback"></div>
  `;
}

function stage6HTML(){
  return `
    <div class="stage-eyebrow">Estágio 06 · Função hash e integridade</div>
    <h2 class="stage-title">A mensagem foi alterada?</h2>
    <p class="stage-text">Um log de acesso foi publicado junto com o seu hash SHA-256 no momento do registro. Duas cópias circularam depois — apenas uma delas é idêntica ao original; a outra foi adulterada. Calcule o hash de cada cópia e compare com o hash publicado para descobrir qual é autêntica.</p>
    <div class="mono-box">Hash publicado (SHA-256):<br><span style="font-size:12px; word-break:break-all;" id="s6published">calculando...</span></div>

    <p class="stage-text" style="margin:18px 0 4px;"><b>Cópia A</b></p>
    <div class="mono-box" style="font-size:13px;">${stage6Original}</div>
    <button class="secondary" onclick="hashStage6('A')">Calcular hash de A</button>
    <div class="mono-box" id="s6hashA" style="font-size:12px; word-break:break-all; min-height:18px; color:#7d8ea0;">—</div>

    <p class="stage-text" style="margin:18px 0 4px;"><b>Cópia B</b></p>
    <div class="mono-box" style="font-size:13px;">${stage6Tampered}</div>
    <button class="secondary" onclick="hashStage6('B')">Calcular hash de B</button>
    <div class="mono-box" id="s6hashB" style="font-size:12px; word-break:break-all; min-height:18px; color:#7d8ea0;">—</div>

    <div class="field-row">
      <input type="text" id="s6input" placeholder="Qual cópia é autêntica? Digite A ou B">
      <button onclick="checkStage6()">Verificar</button>
    </div>
    <div class="feedback" id="s6feedback"></div>
  `;
}

/* ---------------- handlers ---------------- */
function attachHandlers(){
  ['s1input','s2input','s3input','s6input'].forEach(id=>{
    const inp = document.getElementById(id);
    if(inp) inp.addEventListener('keydown', e=>{
      if(e.key==='Enter'){
        if(id==='s1input') checkStage1();
        if(id==='s2input') checkStage2();
        if(id==='s3input') checkStage3();
        if(id==='s6input') checkStage6();
      }
    });
  });
  const s2 = document.getElementById('s2input');
  if(s2) s2.addEventListener('input', ()=>{
    const key = s2.value.trim();
    const prev = document.getElementById('s2preview');
    if(!key){ prev.textContent='Aguardando chave...'; prev.style.color='#7d8ea0'; return; }
    const out = b64ToXorDecrypt(stage2Cipher, key);
    prev.textContent = out.replace(/[^\x20-\x7e]/g,'□');
    prev.style.color = normalize(out)===normalize(stage2Plain) ? '#8fe3c9' : '#f1e6c8';
  });
  const s6pub = document.getElementById('s6published');
  if(s6pub) s6pub.textContent = stage6PublishedHash || 'calculando...';
}

function markSolved(n){
  state.solved[n] = true;
  render();
}

function checkStage1(){
  const val = normalize(document.getElementById('s1input').value);
  const fb = document.getElementById('s1feedback');
  if(val === normalize(stage1Answer)){
    fb.textContent = 'Correto. A mensagem dizia: "' + stage1Answer + '". Estágio decifrado.';
    fb.className = 'feedback ok';
    markSolved(1);
  } else {
    fb.textContent = 'Ainda não é isso. Confira letra por letra na tabela de chaves.';
    fb.className = 'feedback err';
  }
}

function checkStage2(){
  const key = document.getElementById('s2input').value.trim();
  const fb = document.getElementById('s2feedback');
  const out = b64ToXorDecrypt(stage2Cipher, key);
  if(normalize(out) === normalize(stage2Plain)){
    fb.textContent = 'Chave correta! A mensagem dizia: "' + stage2Plain + '". Estágio decifrado.';
    fb.className = 'feedback ok';
    markSolved(2);
  } else {
    fb.textContent = 'Essa chave não revela um texto legível. Pense na convenção do professor.';
    fb.className = 'feedback err';
  }
}

function checkStage3(){
  const d = parseInt(document.getElementById('s3input').value.trim(), 10);
  const fb = document.getElementById('s3feedback');
  const prev = document.getElementById('s3preview');
  if(isNaN(d)){
    fb.textContent = 'Digite um número inteiro para d.';
    fb.className = 'feedback err';
    return;
  }
  if((rsaE * d) % 40 === 1 && d === rsaD){
    const word = rsaCiphers.map(c=> alphabet[modpow(c, d, rsaN) - 1]).join('');
    prev.textContent = 'Mensagem decifrada: ' + word;
    prev.style.color = '#8fe3c9';
    fb.textContent = 'Chave privada correta (d = ' + d + '). Estágio decifrado.';
    fb.className = 'feedback ok';
    markSolved(3);
  } else {
    fb.textContent = 'Esse valor de d não é o inverso modular correto de e. Revise φ(n).';
    fb.className = 'feedback err';
  }
}

function checkStage4(){
  const selects = document.querySelectorAll('#s4items select');
  const chosen = {};
  let allFilled = true;
  selects.forEach(sel=>{
    const v = parseInt(sel.value,10);
    if(!v) allFilled = false;
    chosen[sel.dataset.id] = v;
  });
  const fb = document.getElementById('s4feedback');
  if(!allFilled){
    fb.textContent = 'Numere todos os passos de 1 a 4 antes de verificar.';
    fb.className = 'feedback err';
    return;
  }
  const values = Object.values(chosen);
  const uniqueOk = new Set(values).size === 4;
  const correct = stage4Steps.every(s => chosen[s.id] === s.order);
  if(uniqueOk && correct){
    fb.textContent = 'Sequência correta! Estágio decifrado.';
    fb.className = 'feedback ok';
    markSolved(4);
  } else {
    fb.textContent = 'A ordem ainda não está certa. Pense em quem gera a chave de sessão primeiro.';
    fb.className = 'feedback err';
  }
}

function selectStage5(choice){
  const fb = document.getElementById('s5feedback');
  document.querySelectorAll('#s5items .order-item').forEach(el=>{
    el.style.borderColor = 'var(--line)'; el.style.background='rgba(42,33,24,0.05)';
  });
  const chosenEl = document.querySelector(`#s5items [data-choice="${choice}"]`);
  if(choice === stage5Correct){
    chosenEl.style.borderColor = '#1f7a5c'; chosenEl.style.background='rgba(63,182,168,0.15)';
    fb.textContent = 'Correto! O KDC compartilha uma chave secreta própria com cada usuário desde o cadastro. Estágio decifrado.';
    fb.className = 'feedback ok';
    markSolved(5);
  } else {
    chosenEl.style.borderColor = 'var(--red)'; chosenEl.style.background='rgba(168,58,50,0.12)';
    fb.textContent = 'Não é essa a razão. Pense em como o KDC autentica cada usuário desde o registro.';
    fb.className = 'feedback err';
  }
}

async function hashStage6(which){
  const text = which==='A' ? stage6Original : stage6Tampered;
  const box = document.getElementById('s6hash'+which);
  box.textContent = 'calculando...';
  const h = await sha256Hex(text);
  box.textContent = h;
  box.style.color = (h === stage6PublishedHash) ? '#8fe3c9' : '#f1a19a';
}

function checkStage6(){
  const val = document.getElementById('s6input').value.trim().toUpperCase();
  const fb = document.getElementById('s6feedback');
  if(val === 'A'){
    fb.textContent = 'Correto! A cópia A confere com o hash publicado — a B foi adulterada (IP alterado). Estágio decifrado.';
    fb.className = 'feedback ok';
    markSolved(6);
  } else {
    fb.textContent = 'Calcule o hash de A e de B e compare com o hash publicado acima antes de responder.';
    fb.className = 'feedback err';
  }
}

/* ---------------- final screen ---------------- */
const originalRender = render;
render = function(){
  originalRender();
  const solvedCount = Object.values(state.solved).filter(Boolean).length;
  if(solvedCount===6){
    document.getElementById('stageContent').innerHTML += `
      <div class="final-screen">
        <div class="big">Dossiê encerrado</div>
        <p class="stage-text">Você decifrou as seis mensagens: substituição, simétrica, assimétrica, estratégia híbrida, KDC e função hash — os mesmos princípios usados hoje em TLS, e-mail seguro, VPNs e verificação de integridade de arquivos. Discuta com a turma: qual dessas técnicas resolve qual problema (sigilo, distribuição de chaves ou integridade)?</p>
      </div>`;
  }
}

(async ()=>{
  stage6PublishedHash = await sha256Hex(stage6Original);
  render();
})();
</script>
</body>
</html>
